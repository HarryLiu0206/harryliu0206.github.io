<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text-heading: #111827;
            --text-body: #374151;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --hover-bg: #f3f4f6;
            --link-color: #2563eb;
            --link-hover: #1d4ed8;
        }

        .theme-switch {
            display: none;
        }

        .theme-switch:checked ~ .page-wrap {
            --bg: #111827;
            --card-bg: #1f2937;
            --text-heading: #ffffff;
            --text-body: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --hover-bg: #374151;
            --link-color: #60a5fa;
            --link-hover: #93c5fd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans SC, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-body);
            padding: 32px 16px;
            transition: background 0.3s, color 0.3s;
        }

        .page-wrap {
            max-width: 720px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: background 0.3s;
        }

        .theme-label {
            display: block;
            text-align: right;
            cursor: pointer;
            margin-bottom: 20px;
            color: var(--text-muted);
            user-select: none;
        }

        .head {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }

        .head-info h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        section {
            margin: 32px 0;
        }

        h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-heading);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .desc-text {
            color: var(--text-body);
            line-height: 1.7;
        }

        .link-list {
            display: grid;
            gap: 10px;
        }

        .link-list a {
            display: block;
            padding: 10px 14px;
            background: var(--hover-bg);
            border-radius: 8px;
            text-decoration: none;
            color: var(--link-color);
            transition: background 0.3s, color 0.3s;
        }

        .link-list a:hover {
            color: var(--link-hover);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .page-wrap {
                padding: 22px;
            }

            .head {
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <input type="checkbox" class="theme-switch" id="theme">

    <div class="page-wrap">
        <label for="theme" class="theme-label">🌓 切换暗色/亮色</label>

        <div class="head">
            <img class="avatar" src="Avatar.png" alt="头像">
            <div class="head-info">
                <h1>刘子阳</h1>
            </div>
        </div>

        <section>
            <h2>个人简介</h2>
            <p class="desc-text">
                热爱信息学，持续练习算法与编程。课余时间喜欢钻研各类计算机相关知识，乐于动手实践，不断学习提升。
            </p>
        </section>

        <section>
            <h2>外部链接</h2>
            <div class="link-list">
                <a href="https://acpro.cc/user/78" target="_blank">AcPro 主页</a>
		<a href="https://www.luogu.com.cn/user/1397724" target="_blank">Luogu 主页</a>
            </div>
        </section>

        <footer>
            © 2026
        </footer>
    </div>
</body>
</html>
